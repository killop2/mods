plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.140'
}

version = '1.0.0'
group = 'com.example.playermodels'
base { archivesName = 'playermodels-1.21.1' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.248'
    runs { client { client() } }
    mods { playermodels { sourceSet sourceSets.main } }
}

dependencies {
    compileOnly files('libs/huggynpc-1.21.1-1.0.0.jar')
    compileOnly files('libs/sable_player_ragdoll-1.21.1-0.7.5.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}