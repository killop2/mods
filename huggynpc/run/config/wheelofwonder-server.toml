#How far the wheel can be sent (blocks)
# Default: 48.0
# Range: 4.0 ~ 128.0
maxRange = 48.0
#Top rolling speed, blocks per second
# Default: 10.0
# Range: 1.0 ~ 40.0
rollSpeed = 10.0
#How high the wheel floats above the ground after it stops (blocks)
# Default: 1.3
# Range: 0.2 ~ 6.0
hoverHeight = 1.3
#Radius in which the hovering wheel mesmerizes NPCs (blocks)
# Default: 14.0
# Range: 2.0 ~ 64.0
attractRadius = 14.0
#NPCs this close to the rolling wheel are mesmerized already on its way (blocks)
# Default: 5.0
# Range: 0.0 ~ 32.0
pathRadius = 5.0
#Speed at which mesmerized NPCs float to the wheel, blocks per second
# Default: 7.0
# Range: 0.5 ~ 40.0
pullSpeed = 7.0
#Seconds of hovering until the wheel explodes when it has caught nobody
# Default: 4.0
# Range: 0.5 ~ 60.0
emptyFuseSeconds = 4.0
#Seconds from the first NPC stuck to the wheel until it explodes
# Default: 6.0
# Range: 0.5 ~ 60.0
captureFuseSeconds = 6.0
#Speed of the NPCs thrown by the explosion, m/s
# Default: 16.0
# Range: 0.0 ~ 80.0
blastSpeed = 16.0
#Other NPCs within this distance of the explosion are thrown too (blocks)
# Default: 5.0
# Range: 0.0 ~ 32.0
blastRadius = 5.0
#How long thrown NPCs lie as a ragdoll. 0 = until /wheelofwonder release (or kickmod's /unragdoll)
# Default: 0
# Range: 0 ~ 3600
ragdollSeconds = 0
#NPCs caught by the wheel take no damage (no fall damage while pulled, no landing damage as a ragdoll)
protectNpcs = true
#Ragdolls on the wheel are limp (needs kickmod installed: uses its soft-joint setting)
limpRagdolls = true
#Item cooldown in ticks (20 = 1 second)
# Default: 120
# Range: 0 ~ 72000
cooldownTicks = 120
#Carnival tune while the wheel hovers
music = true

[walrusPunch]
	#Damage of the critical uppercut
	# Default: 14.0
	# Range: 0.0 ~ 1000.0
	critDamage = 14.0
	#How high the uppercut lifts the NPC (blocks); lower automatically under a ceiling
	# Default: 11.0
	# Range: 2.0 ~ 40.0
	uppercutHeight = 11.0
	#Max distance to the NPC for the combo (blocks)
	# Default: 4.5
	# Range: 1.0 ~ 8.0
	reach = 4.5
	#Cooldown after a combo, ticks (meanwhile the gloves punch normally)
	# Default: 60
	# Range: 0 ~ 72000
	cooldownTicks = 60
	#Seconds the NPC takes to fly up to the top (slow-motion feel)
	# Default: 3.6
	# Range: 0.5 ~ 20.0
	riseTime = 3.6
	#Seconds of the side view before the uppercut (the NPC waits)
	# Default: 1.5
	# Range: 0.0 ~ 10.0
	introTime = 1.5
	#Seconds the smashed NPC takes to fall back to the ground (it speeds up all the way down)
	# Default: 1.5
	# Range: 0.3 ~ 20.0
	fallTime = 1.5
