plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.140'
}

version = '1.0.0'
group = 'com.example.flatoutcar'

base {
    archivesName = 'flatoutcar-1.21.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.219'

    runs {
        client {
            type = 'client'
        }
        server {
            type = 'server'
            programArgument '--nogui'
        }
    }

    mods {
        flatoutcar {
            sourceSet sourceSets.main
        }
    }
}

// Никаких внешних зависимостей: ragdoll-мод вызывается через reflection (см. RagdollBridge),
// поэтому конфликтов с вашими модами и репозиториями нет.
